version: 2

updates:
  # Action digests are pinned by SHA, so Dependabot is the only practical way to
  # keep them current without losing the pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      # The runtime stack is pinned to exact versions and shares a release
      # cadence, so a single reviewable PR beats four competing ones.
      react-and-next:
        applies-to: version-updates
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        applies-to: version-updates
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      dev-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@biomejs/biome"
          - "@types/node"
          - "@vitest/*"
          - agent-browser
          - typescript
          - vitest
    ignore:
      # TypeScript 7 is a major migration to schedule deliberately, not to
      # absorb through an automated bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
