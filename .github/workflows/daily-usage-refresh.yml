name: Daily usage refresh

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-usage-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      start_sha: ${{ steps.baseline.outputs.start_sha }}
    env:
      TZ: UTC
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Establish clean baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The checkout is not clean before synchronization." >&2
            git status --short
            exit 1
          fi
          start_sha="$(git rev-parse HEAD)"
          echo "start_sha=$start_sha" >> "$GITHUB_OUTPUT"
          echo "Starting commit: \`$start_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Synchronize usage sources
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run sync:usage

      - name: Triage new stable releases with GPT-OSS
        id: release_triage
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run triage:releases

      - name: Record deferred release triage
        if: always() && steps.release_triage.outcome == 'failure'
        run: |
          echo "::warning::GPT-OSS release triage failed; factual usage synchronization will continue and the untriaged release will be retried tomorrow."
          echo "GPT-OSS release triage was deferred after an API, schema, or validation failure; no model output was published." >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect generated change
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-usage-refresh-diff.mjs
          git diff --check
          git status --short
          git diff --stat
          git diff
          if git diff --quiet -- research/release-review-queue.json src/data/openrouter-attribution.ts src/data/ecosystem-signals.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source values changed; nothing will be published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependency advisories
        if: steps.diff.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: Verify sources, contracts, and static export
        if: steps.diff.outputs.changed == 'true'
        run: npm run verify:maintenance

      - name: Re-review publish scope
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/validate-usage-refresh-diff.mjs
          git diff --check
          git status --short
          git diff --stat
          git diff

      - name: Prepare reviewed patch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- research/release-review-queue.json src/data/openrouter-attribution.ts src/data/ecosystem-signals.ts > usage-refresh.patch

      - name: Upload reviewed patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: usage-refresh-${{ steps.baseline.outputs.start_sha }}
          path: usage-refresh.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    steps:
      - name: Check out reviewed baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.start_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download reviewed patch
        uses: actions/download-artifact@v7
        with:
          name: usage-refresh-${{ needs.refresh.outputs.start_sha }}

      - name: Apply and validate reviewed patch
        run: |
          set -euo pipefail
          git apply --index usage-refresh.patch
          rm usage-refresh.patch
          node scripts/validate-usage-refresh-diff.mjs
          git diff --cached --check

      - name: Confirm main has not advanced
        env:
          START_SHA: ${{ needs.refresh.outputs.start_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$START_SHA" ]]; then
            echo "origin/main advanced from $START_SHA to $remote_sha; refusing to push." >&2
            exit 1
          fi

      - name: Commit and push generated data
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/openrouter-attribution.ts src/data/ecosystem-signals.ts
          if [[ -f research/release-review-queue.json ]]; then
            git add research/release-review-queue.json
          fi
          git diff --cached --check
          git commit -m "chore(data): refresh usage signals and release triage $(date -u +%F)"
          published_sha="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
          echo "Published commit: \`$published_sha\`" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      deployments: read
    steps:
      - name: Check out published commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.published_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without credentials
        run: npm ci

      - name: Run quality gate for published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ needs.publish.outputs.published_sha }}
        run: node scripts/wait-for-quality-gate.mjs

      - name: Wait for Vercel production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ needs.publish.outputs.published_sha }}
        run: node scripts/wait-for-production-deployment.mjs

      - name: Smoke-test production
        run: node scripts/smoke-test-production.mjs

      - name: Record completion
        run: |
          echo "Usage data refreshed from source-native APIs." >> "$GITHUB_STEP_SUMMARY"
          echo "GPT-OSS output, when present, is a repository-only editorial queue and not product evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "Recommendation, capability, membership, methodology, and verification dates were not changed." >> "$GITHUB_STEP_SUMMARY"
