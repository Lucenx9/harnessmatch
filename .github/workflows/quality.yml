name: Quality gate
run-name: Quality gate ${{ inputs.commit_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact repository commit to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test data and ranking contracts
        run: npm test
      - name: Build static export
        run: npm run build
