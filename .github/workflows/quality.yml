name: Quality gate
run-name: Quality gate ${{ inputs.commit_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact repository commit to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test data and ranking contracts
        run: npm test
      - name: Build static export
        run: npm run build
